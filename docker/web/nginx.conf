# Unity WebGL builds ship pre-compressed files (.br or .gz). Serve them with the matching
# Content-Encoding so the browser decompresses them, and with the right MIME types.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ \.br$ {
        add_header Content-Encoding br;
        default_type application/octet-stream;
        location ~ \.wasm\.br$ { add_header Content-Encoding br; default_type application/wasm; }
        location ~ \.js\.br$   { add_header Content-Encoding br; default_type application/javascript; }
        location ~ \.data\.br$ { add_header Content-Encoding br; default_type application/octet-stream; }
    }

    location ~ \.gz$ {
        add_header Content-Encoding gzip;
        default_type application/octet-stream;
        location ~ \.wasm\.gz$ { add_header Content-Encoding gzip; default_type application/wasm; }
        location ~ \.js\.gz$   { add_header Content-Encoding gzip; default_type application/javascript; }
        location ~ \.data\.gz$ { add_header Content-Encoding gzip; default_type application/octet-stream; }
    }

    location ~ \.wasm$ { default_type application/wasm; }

    # Playtest builds change often; do not let browsers cache index.html.
    location = /index.html { add_header Cache-Control "no-cache"; }
}
