# Core checks on every push and PR: build with warnings as errors, unit tests, a short headless
# simulation as a smoke test, and ruff on the Python tools. No Unity license needed.
name: core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore LowObservable.sln
      - name: Build (warnings are errors)
        run: dotnet build LowObservable.sln -c Release --no-restore -nologo
      - name: Format check
        run: dotnet format LowObservable.sln --verify-no-changes --no-restore
      - name: Unit tests
        run: dotnet test dotnet/LowObservable.Core.Tests -c Release --no-build -nologo --logger "trx;LogFileName=core-tests.trx"
      - name: Headless simulation smoke test
        run: dotnet run -c Release --no-build --project dotnet/LowObservable.Sim -- --policy all --seeds 3 --out build/sim --summary-only
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-results
          path: |
            dotnet/LowObservable.Core.Tests/TestResults/
            build/sim/

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check tools
